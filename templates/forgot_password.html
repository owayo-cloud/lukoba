{% extends "base.html" %}

{% block extrastyles %}
<title>Forgot Password</title>
<link rel="stylesheet" href="/static/css/signLog.css">
{% endblock extrastyles %}

{% block content %}
<div class="form_container">
    <div class="form_box">
        <h2>Forgot Password</h2>
        <form method="post">
            <div class="input_group">
                <div class="input_field">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="forgotEmail" placeholder="Enter your email" name="email" required>
                </div>
                <button type="submit" id="requestResetBtn">Request Password Reset</button>
            </div>  
        </form>
        <div class="form_footer">
            <p>Back to <a href="/login">Login</a></p>
        </div>
    </div>
</div>
{% endblock content %}

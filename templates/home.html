{% extends "base.html" %}

{% block content %}
<!-- Carousel -->
<div class="carousel">
    <div class="list">
        {% for movie in movies %}
        <div class="item {% if loop.first %}active{% endif %}">
            <img src="{{ movie.poster }}" alt="{{ movie.title }}">
            <div class="content">
                <div class="title">{{ movie.title }}</div>
                <div class="genre">{{ movie.genre }}</div>
                <div class="des">{{ movie.description }}</div>
                <div class="buttons">
                    <button id="extras">Trailer</button>
                    <button id="bkNow">BOOK NOW</button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- Thumbnails -->
    <div class="thumbnail">
        {% for movie in movies %}
        <div class="item {% if loop.first %}active{% endif %}">
            <img src="{{ movie.poster }}" alt="{{ movie.title }}">
            <div class="content">
                <div class="title">{{ movie.title }}</div>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- Next Prev -->
    <div class="arrows">
        <button id="prev">&lt;</button>
        <button id="next">&gt;</button>
    </div>

    <!-- Time Running -->
    <div class="time"></div>
</div>
{% endblock content %}

{% block extrascripts %}
<script src="/static/js/script.js"></script>
{% endblock extrascripts %}

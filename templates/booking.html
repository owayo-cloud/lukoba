{% extends "base.html" %}

{% block extrastyles %}
<link rel="stylesheet" href="/static/css/booking.css">
{% endblock extrastyles %}

{% block content %}
<div class="mid">
    <div class="tickets">
        <div class="ticket-selector">
            <div class="heading">
                <div class="title">Movie: </div>
            </div>
            <div class="seats">
                <div class="status">
                    <div class="item">Available</div>
                    <div class="item">Booked</div>
                    <div class="item">Selected</div>
                </div>
                <div class="screen"></div>
                <div class="all-seats">
                    <!--Dynamically generated in booking.js-->
                </div>
            </div>
            <div class="timings">
                <div class="dates">
                    <input type="radio" name="date" id="d1" checked>
                    <label for="d1" class="dates-item">
                        <div class="day">{Day}</div>
                        <div class="date">{Date}</div>
                    </label>
                    <input type="radio" name="date" id="d2" checked>
                    <label for="d2" class="dates-item">
                        <div class="day">{Day}</div>
                        <div class="date">{Date}</div>
                    </label>
                </div>
                <div class="times">
                    <input type="radio" name="time" id="t1" checked>
                    <label for="t1" class="time">{Times}</label>
                    <input type="radio" name="time" id="t2" checked>
                    <label for="t2" class="time">{Times}</label>
                     <input type="radio" name="time" id="t3" checked>
                    <label for="t3" class="time">{Times}</label>
                    <input type="radio" name="time" id="t4" checked>
                    <label for="t4" class="time">{Times}</label>
                </div>
            </div>
            <div class="price">
                <p class="text">You have selected <span id="count">0</span> seat(s) for a price of Ksh.<span id="total">0</span
                    >
                  </p>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
{% block extrascripts %}
<script src="/static/js/booking.js"></script>
{% endblock extrascripts %}

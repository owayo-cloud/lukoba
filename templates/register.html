{% extends "base.html" %}


{% block extrastyles %}
<title>Registration</title>
<link rel="stylesheet" href="/static/css/signLog.css">
<link rel="stylesheet" href="/static/css/style.css">
{% endblock extrastyles %}

{% block content %}
<div class="form_container">
    <div class="form_box">
        <h2 id="title">sign up</h2>
        <form method="post">
            <div class="input_group">
                <div class="input_field" id="nameField">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="username" placeholder="Name" name="username" required>
                </div>
                <div class="input_field">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email" name="email" required>
                </div>
                <div class="input_field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="signupPassword" placeholder="Password" name="password" required>
                    <span class="toggle-password" onclick="togglePassword('signupPassword', this)"><i class="fa-solid fa-eye"></i></span>
                </div>
                <button type="submit">REGISTER</button>
            </div>
        </form>
        <div class="form_footer" id="rForm_footer">
            <hr>
            <p>Already have an account? <a href="/login">Login</a></p>
        </div>
    </div>
</div>

{% endblock content %}

{% block extrascripts %}
<script src="https://kit.fontawesome.com/a960bf3c61.js" crossorigin="anonymous"></script>
<script>
    function togglePassword(inputId, toggleIcon) {
    const passwordField = document.getElementById(inputId);
    const eyeIcon = toggleIcon.querySelector('i');

    if (passwordField.type === "password") {
        passwordField.type = "text";
        eyeIcon.classList.remove('fa-eye'); // Remove open eye icon
        eyeIcon.classList.add('fa-eye-slash'); // Add closed eye icon
    } else {
        passwordField.type = "password";
        eyeIcon.classList.remove('fa-eye-slash'); // Remove closed eye icon
        eyeIcon.classList.add('fa-eye'); // Add open eye icon
    }
}
document.querySelector('form').addEventListener('submit', function(event) {
    var email = document.getElementById('email').value;
    var password = document.getElementById('signupPassword').value;
    var username = document.getElementById('username').value;

    // Email validation
    if (!validateEmail(email)) {
        alert("Please enter a valid email address.");
        event.preventDefault(); // Prevent form submission
    }

    // Password validation
    if (!validatePassword(password)){
        alert("Password must be at least 8 characters long and contain at least one capital letter.");
        event.preventDefault(); // Prevent form submission
    }

    // Username validation
    if (username.trim() === "") {
        alert("Username cannot be empty.");
        event.preventDefault(); // Prevent form submission
    }

    // If any validation fails
    if (!validateEmail(email) || !validatePassword(password) || username.trim() === "") {
        alert("Registration failed. Please check the inputs and try again.");
        event.preventDefault(); // Prevent form submission
    }

    // If all validations pass
    if (validateEmail(email) && validatePassword(password) && username.trim() !== "") {
        alert("Registration successful!");
    }
});

function validateEmail(email) {
    // Check for the presence of exactly one "@" symbol
    var atSymbolCount = 0;
    for (var i = 0; i < email.length; i++) {
        if (email[i] === '@') {
            atSymbolCount++;
        }
    }
    if (atSymbolCount !== 1) {
        return false;
    }

    // Split the email into local part and domain part
    var atPosition = email.indexOf('@');
    var localPart = email.slice(0, atPosition);
    var domainPart = email.slice(atPosition + 1);

    // Ensure both parts are not empty
    if (localPart.length === 0 || domainPart.length === 0) {
        return false;
    }

    // Ensure the domain part contains a period (.)
    if (domainPart.indexOf('.') === -1) {
        return false;
    }

    // Ensure the domain doesn't start or end with a period
    if (domainPart[0] === '.' || domainPart[domainPart.length - 1] === '.') {
        return false;
    }

    // Ensure the local part contains only valid characters
    var validLocalChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789._%+-";
    for (var i = 0; i < localPart.length; i++) {
        if (validLocalChars.indexOf(localPart[i]) === -1) {
            return false;
        }
    }

    // Ensure the domain part contains only valid characters
    var validDomainChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.-";
    for (var i = 0; i < domainPart.length; i++) {
        if (validDomainChars.indexOf(domainPart[i]) === -1) {
            return false;
        }
    }

    // All checks passed
    return true;
}
function validatePassword(password) {
    // Check if the password is at least 8 characters long
    if (password.length < 8) {
        return false;
    }

    // Check if the password contains at least one uppercase letter
    var hasUppercase = false;
    for (var i = 0; i < password.length; i++) {
        if (password[i] >= 'A' && password[i] <= 'Z') {
            hasUppercase = true;
            break;
        }
    }

    // If it has an uppercase letter, return true
    if (hasUppercase) {
        return true;
    } else {
        return false;
    }
}

</script>
{% endblock extrascripts %}

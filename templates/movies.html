{% extends "base.html" %}

{% block extrastyles %}
<title>LuKoBa | Movies</title>
<link rel="stylesheet" href="/static/css/movies.css">
{% endblock extrastyles %}

{% block content %}
<div class="container">
    <div class="content-container">
        <div class="movie-list-container">
            <h1 class="movie-list-title">Movies</h1>
            <div class="movie-list-wrapper">
                <div class="movie-list">
                    <div class="movie-list-item">
                        <img class="movie-list-item-img" src="/static/image/1.jpg" alt="">
                        <span class="movie-list-item-title">{Title}</span>
                        <p class="movie-list-item-genre">{Genre}</p>
                        <button class="movie-list-item-button">Watch</button>
                    </div>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
{% block extrascripts %}
<script src="/static/js/movies.js"></script>
{% endblock extrascripts %}

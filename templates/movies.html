{% extends "base.html" %}

{% block extrastyles %}
<title>LuKoBa | Movies</title>
<link rel="stylesheet" href="/static/css/movies.css">
{% endblock extrastyles %}

{% block content %}
<div class="container">
    <form action="/movies" method="get" id="search-form">
        <div class="form_input">
            <input type="search" placeholder="Search for Movies..." name="title" id="search-input">
            <button class="search-btn" type="submit"><i class="bx bx-search"></i></button>
        </div>
    </form>
    <div class="content-container">
        <div class="movie-list-container">
            <h1 class="movie-list-title">Movies</h1>
            <div class="movie-list-wrapper">
                <div class="movie-list">
                {% for movie in movies %}
                    <div class="movie-list-item">
                        <img class="movie-list-item-img" src="{{ movie.Poster }}" alt="{{ movie.Title }}">
                        <div class="movie-list-item-info">
                            <span class="movie-list-item-title">{{ movie.Title }}</span>
                            <p class="movie-list-item-genre">{{ movie.Genre }}</p>
                        </div>
                        <a class="movie-list-item-button" href="/watch/{{movie.id}}">Watch</a>
                    </div>
                {% endfor %}
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
{% block extrascripts %}
<script src="/static/js/movies.js"></script>
{% endblock extrascripts %}
